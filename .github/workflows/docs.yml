name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test local inventory
        run: python -m unittest discover -s tests -p "test_inventory*.py" -v
      - name: Test read-only knowledge inspection
        run: python -m unittest discover -s tests -p "test_knowledge.py" -v
      - name: Test read-only knowledge preparation
        run: python -m unittest discover -s tests -p "test_preparation.py" -v
      - name: Install optional receipt verifier
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements-receipts.txt
      - name: Test explicit-policy receipt verification
        run: python -m unittest discover -s tests -p "test_receipts.py" -v
      - name: Test host-configured verification tool
        run: python -m unittest discover -s tests -p "test_harness.py" -v
  docs:
    name: Documentation checks
    needs: inventory
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful inventory tests
        env:
          INVENTORY_RESULT: ${{ needs.inventory.result }}
        run: test "$INVENTORY_RESULT" = success
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install documentation tooling
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Test documentation checker
        run: python -m unittest discover -s tests -p test_check_docs.py -v
